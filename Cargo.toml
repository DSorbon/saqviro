[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/saqviro/saqviro"
rust-version = "1.89"

[workspace.dependencies]
saqviro-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
schemars = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
