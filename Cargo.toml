[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/saqviro/saqviro"
rust-version = "1.89"

[workspace.dependencies]
lopdf = "0.47"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "image_025"] }
saqviro-core = { path = "crates/core" }
saqviro-jobs = { path = "crates/jobs" }
saqviro-tools = { path = "crates/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
schemars = "1"
thiserror = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "avif"] }
fast_image_resize = { version = "6", features = ["image"] }
mozjpeg = "0.10"
webp = { version = "0.3", default-features = false, features = ["img"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
crc32fast = "1"
# v1_17: the oldest libheif we support (Ubuntu 24.04).
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
