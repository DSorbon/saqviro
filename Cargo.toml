[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/DSorbon/saqviro"
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.23"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md-5 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
rqrr = { version = "0.11", default-features = false }
sha1 = "0.11"
sha2 = "0.11"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
lopdf = "0.47"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "image_025"] }
saqviro-core = { path = "crates/core" }
saqviro-jobs = { path = "crates/jobs" }
saqviro-tools = { path = "crates/tools" }
saqviro-workflow = { path = "crates/workflow" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2"
schemars = "1"
thiserror = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp", "avif", "ico"] }
fast_image_resize = { version = "6", features = ["image"] }
mozjpeg = "0.10"
webp = { version = "0.3", default-features = false, features = ["img"] }
oxipng = { version = "10", default-features = false, features = ["parallel"] }
crc32fast = "1"
kamadak-exif = "0.6"
resvg = "0.45"
csv = "1"
deunicode = "1"
hmac = "0.13"
html-escape = "0.2"
mime_guess = "2"
percent-encoding = "2"
quick-xml = "0.38"
rand = "0.9"
url = "2"
similar = "2"
# v1_17: the oldest libheif we support (Ubuntu 24.04).
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://v2.tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
