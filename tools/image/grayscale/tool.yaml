# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.grayscale
name: Make Images Black and White
category: image
tool_version: 1
description: Turn images black and white.
keywords: [black and white, monochrome, desaturate, grayscale]
inputs:
  - type: image
    multiple: true
    mime: [image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff]
    extensions: [jpg, jpeg, png, webp, gif, bmp, tif, tiff]
outputs:
  - type: image
    multiple: true
    filename: "{stem}-gray.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
ui:
  preview: compare
