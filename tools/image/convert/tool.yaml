# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.convert
name: Convert Images
category: image
tool_version: 1
description: Convert images to JPG, PNG, WebP or AVIF.
keywords: [format, change, jpg, png, webp, avif, save as, batch]
inputs:
  - type: image
    multiple: true
    mime: [image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff]
    extensions: [jpg, jpeg, png, webp, gif, bmp, tif, tiff]
outputs:
  - type: image
    multiple: true
    filename: "{stem}.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: format, type: enum, values: [jpg, png, webp, avif], default: jpg }
  - { id: quality, type: integer, min: 1, max: 100, default: 85 }
presets:
  - { id: jpg, name: JPG, params: { format: jpg } }
  - { id: png, name: PNG, params: { format: png } }
  - { id: webp, name: WebP, params: { format: webp } }
  - { id: avif, name: AVIF, params: { format: avif } }
ui:
  advanced: [quality]
