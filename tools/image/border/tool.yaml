# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.border
name: Add Image Border
category: image
tool_version: 1
description: Add a colored border around images.
keywords: [frame, padding, margin]
inputs:
  - type: image
    multiple: true
    mime: [image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff]
    extensions: [jpg, jpeg, png, webp, gif, bmp, tif, tiff]
outputs:
  - type: image
    multiple: true
    filename: "{stem}-border.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: width, type: integer, min: 1, max: 2000, default: 20 }
  - { id: color, type: string, default: "#ffffff" }
presets:
  - { id: default, name: Default }
