# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.compare
name: Compare Images
category: image
tool_version: 1
description: See how much two images differ, and where.
keywords: [difference, diff, visual, regression, image]
inputs:
  - type: image
    multiple: true
    min_files: 2
    mime: [image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff]
    extensions: [jpg, jpeg, png, webp, gif, bmp, tif, tiff]
outputs:
  - type: image
    filename: "{stem}-diff.png"
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
