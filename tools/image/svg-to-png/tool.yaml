# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.svg-to-png
name: SVG to PNG
category: image
tool_version: 1
description: Draw SVG files as PNG images at any size.
keywords: [vector, rasterize, export]
inputs:
  - type: image
    multiple: true
    mime: [image/svg+xml]
    extensions: [svg]
outputs:
  - type: image
    multiple: true
    filename: "{stem}.png"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: width, type: integer, min: 1, max: 16000, optional: true }
presets:
  - { id: default, name: Default }
ui:
  preview: compare
