# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: image.watermark
name: Add Watermark to Image
category: image
tool_version: 1
description: Print text on images, in any language.
keywords: [stamp, copyright, logo, text, overlay]
inputs:
  - type: image
    multiple: true
    mime: [image/jpeg, image/png, image/webp, image/gif, image/bmp, image/tiff]
    extensions: [jpg, jpeg, png, webp, gif, bmp, tif, tiff]
outputs:
  - type: image
    multiple: true
    filename: "{stem}-watermarked.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: text, type: string }
  - { id: size, type: integer, min: 1, max: 50, default: 5 }
  - { id: position, type: enum, values: [bottom-right, bottom-left, top-right, top-left, center], default: bottom-right }
  - { id: x, type: number, min: 0, max: 100, optional: true }
  - { id: y, type: number, min: 0, max: 100, optional: true }
  - { id: opacity, type: integer, min: 5, max: 100, default: 60 }
  - { id: color, type: string, default: "#ffffff" }
presets:
  - { id: default, name: Default }
ui:
  preview: compare
  advanced: [opacity, color, x, y]
