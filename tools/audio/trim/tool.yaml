# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: audio.trim
name: Trim Audio
category: audio
tool_version: 1
description: Keep part of an audio file. Times look like 1:30.
keywords: [cut, clip, shorten, ringtone, split]
inputs:
  - type: audio
    multiple: true
    mime: [audio/mpeg, audio/mp4, audio/aac, audio/wav, audio/flac, audio/ogg, audio/opus, audio/aiff, audio/x-ms-wma]
    extensions: [mp3, m4a, aac, wav, flac, ogg, opus, aiff, wma]
outputs:
  - type: audio
    multiple: true
    filename: "{stem}-trimmed.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: start, type: string, optional: true }
  - { id: end, type: string, optional: true }
presets:
  - { id: default, name: Default }
ui:
  preview: timeline
  one_of: [start, end]
  advanced: [start, end]
