# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.extract-audio
name: Extract Audio
category: video
tool_version: 1
description: Save the sound of a video as an audio file.
keywords: [audio, sound, music, mp3, rip, soundtrack]
inputs:
  - type: video
    multiple: true
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm, avi, mpg, mpeg, wmv, flv, 3gp, ts]
outputs:
  - type: audio
    multiple: true
    filename: "{stem}.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: format, type: enum, values: [mp3, m4a, wav, flac, ogg], default: mp3 }
  - { id: bitrate, type: integer, min: 64, max: 320, default: 192 }
presets:
  - { id: mp3, name: MP3, params: { format: mp3 } }
  - { id: m4a, name: M4A, params: { format: m4a } }
  - { id: wav, name: WAV, params: { format: wav } }
  - { id: flac, name: FLAC, params: { format: flac } }
ui:
  advanced: [bitrate]
