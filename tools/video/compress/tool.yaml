# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.compress
name: Compress Video
category: video
tool_version: 1
description: Make videos smaller to send or store.
keywords: [compress, smaller, reduce, shrink, size, email, mp4]
inputs:
  - type: video
    multiple: true
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm, avi, mpg, mpeg, wmv, flv, 3gp, ts]
outputs:
  - type: video
    multiple: true
    filename: "{stem}-compressed.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: quality, type: integer, min: 10, max: 90, default: 50 }
  - { id: resolution, type: enum, values: [original, "1080", "720", "480"], default: original }
presets:
  - { id: balanced, name: Balanced, params: { quality: 50 } }
  - { id: smaller, name: Smaller, params: { quality: 30, resolution: "720" } }
  - { id: best, name: Best quality, params: { quality: 70 } }
ui:
  advanced: [quality, resolution]
