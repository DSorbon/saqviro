# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.from-gif
name: GIF to Video
category: video
tool_version: 1
description: Turn an animated GIF into a much smaller MP4.
keywords: [gif, mp4, animation, convert]
inputs:
  - type: video
    multiple: true
    mime: [image/gif]
    extensions: [gif]
outputs:
  - type: video
    multiple: true
    filename: "{stem}.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
ui:
  preview: compare
