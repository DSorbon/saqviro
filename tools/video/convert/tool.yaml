# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.convert
name: Convert Video
category: video
tool_version: 1
description: Convert videos to MP4, MOV, MKV or WebM.
keywords: [format, change, mp4, mov, mkv, webm, avi, save as]
inputs:
  - type: video
    multiple: true
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm, avi, mpg, mpeg, wmv, flv, 3gp, ts]
outputs:
  - type: video
    multiple: true
    filename: "{stem}.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: format, type: enum, values: [mp4, mov, mkv, webm], default: mp4 }
presets:
  - { id: mp4, name: MP4, params: { format: mp4 } }
  - { id: mov, name: MOV, params: { format: mov } }
  - { id: mkv, name: MKV, params: { format: mkv } }
  - { id: webm, name: WebM, params: { format: webm } }
