# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.merge
name: Merge Videos
category: video
tool_version: 1
description: Join videos one after another into a single file.
keywords: [join, combine, concat, append]
inputs:
  - type: video
    multiple: true
    min_files: 2
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm, avi, mpg, mpeg, wmv, flv, 3gp, ts]
outputs:
  - type: video
    filename: "{stem}-merged.{ext}"
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
ui:
  preview: media-stack
