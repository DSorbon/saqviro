# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.subtitles
name: Extract Subtitles
category: video
tool_version: 1
description: Save the subtitles inside a video as a file.
keywords: [srt, captions, vtt, text track, subtitle, extractor]
inputs:
  - type: video
    multiple: true
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm]
outputs:
  - type: text
    multiple: true
    filename: "{stem}.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: format, type: enum, values: [srt, vtt], default: srt }
  - { id: track, type: integer, min: 1, max: 100, default: 1 }
presets:
  - { id: default, name: Default }
ui:
  facts: video.info
  advanced: [track]
