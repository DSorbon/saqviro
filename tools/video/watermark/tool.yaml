# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: video.watermark
name: Add Watermark to Video
category: video
tool_version: 1
description: Print text on a video, in any language.
keywords: [stamp, copyright, logo, text, overlay]
inputs:
  - type: video
    multiple: true
    mime: [video/mp4, video/quicktime, video/x-m4v, video/x-matroska, video/webm, video/x-msvideo, video/mpeg, video/x-ms-wmv, video/x-flv, video/3gpp, video/mp2t]
    extensions: [mp4, mov, m4v, mkv, webm, avi, mpg, mpeg, wmv, flv, 3gp, ts]
outputs:
  - type: video
    multiple: true
    filename: "{stem}-watermarked.{ext}"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: text, type: string }
  - { id: size, type: integer, min: 1, max: 50, default: 5 }
  - { id: position, type: enum, values: [bottom-right, bottom-left, top-right, top-left, center], default: bottom-right }
  - { id: opacity, type: integer, min: 5, max: 100, default: 60 }
  - { id: color, type: string, default: "#ffffff" }
presets:
  - { id: default, name: Default }
ui:
  advanced: [opacity, color]
