# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: privacy.password-strength
name: Check Password Strength
category: privacy
tool_version: 1
description: See how long a password would hold out, on this device only.
keywords: [secure, crack, entropy, weak, checker]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
