# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: files.folder-checksum
name: Folder Checksum
category: files
tool_version: 1
description: One SHA-256 for everything in a folder, to compare two copies.
keywords: [hash, compare, verify, integrity, backup]
inputs:
  - type: any
    multiple: true
    mime: ["*/*"]
    extensions: ["*"]
outputs:
  - type: text
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
