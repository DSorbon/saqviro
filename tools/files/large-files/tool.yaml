# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: files.large
name: Large Files Finder
category: files
tool_version: 1
description: List the largest files in a folder.
keywords: [big, space, disk, cleanup]
inputs:
  - type: any
    multiple: true
    folders: true
    mime: ["*/*"]
    extensions: ["*"]
outputs:
  - type: text
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: top, type: integer, min: 1, max: 1000, default: 50 }
  - { id: min_mb, type: integer, min: 0, max: 1000000, default: 10 }
presets:
  - { id: default, name: Default }
