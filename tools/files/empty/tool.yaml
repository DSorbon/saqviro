# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: files.empty
name: Find Empty Folders
category: files
tool_version: 1
description: List empty folders and empty files.
keywords: [blank, cleanup, zero, unused, folder, finder]
inputs:
  - type: any
    multiple: true
    folders: true
    mime: ["*/*"]
    extensions: ["*"]
outputs:
  - type: text
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
