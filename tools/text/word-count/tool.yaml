# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: text.word-count
name: Word Counter
category: text
tool_version: 1
description: Count words, characters, lines and reading time.
keywords: [count, characters, length, words, letters, essay]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
