# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: pdf.split
name: Split PDF
category: pdf
tool_version: 1
description: Split a PDF into single pages or equal parts.
keywords: [separate, divide, break, pages]
inputs:
  - type: pdf
    multiple: true
    mime: [application/pdf]
    extensions: [pdf]
outputs:
  - type: pdf
    multiple: true
    filename: "{stem}-{part}.pdf"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: pages, type: integer, min: 1, max: 10000, default: 1 }
presets:
  - { id: single, name: Every page, params: { pages: 1 } }
  - { id: pairs, name: Every 2 pages, params: { pages: 2 } }
  - { id: tens, name: Every 10 pages, params: { pages: 10 } }
