# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: pdf.to-text
name: PDF to Text
category: pdf
tool_version: 1
description: Extract the text of a PDF.
keywords: [extract, copy, txt, words]
inputs:
  - type: pdf
    multiple: true
    mime: [application/pdf]
    extensions: [pdf]
outputs:
  - type: text
    multiple: true
    filename: "{stem}.txt"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
ui:
  facts: pdf.info
