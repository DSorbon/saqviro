# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: pdf.extract-images
name: Extract Images from PDF
category: pdf
tool_version: 1
description: Save the pictures inside a PDF.
keywords: [pictures, photos, export]
inputs:
  - type: pdf
    multiple: true
    mime: [application/pdf]
    extensions: [pdf]
outputs:
  - type: image
    multiple: true
    filename: "{stem}-images"
engine: builtin
capabilities: { batch: true, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
presets:
  - { id: default, name: Default }
ui:
  facts: pdf.info
