# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: qr.wifi
name: Make Wi-Fi QR Code
category: qr
tool_version: 1
description: A QR code that joins a Wi-Fi network when scanned.
keywords: [wifi, wireless, network, guest, password, wi-fi]
inputs:
  - type: none
outputs:
  - type: image
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: network, type: string }
  - { id: password, type: string, secret: true, optional: true }
  - { id: security, type: enum, values: [WPA, WEP, none], default: WPA }
  - { id: hidden, type: boolean, default: false }
  - { id: size, type: integer, min: 64, max: 4096, default: 512 }
presets:
  - { id: default, name: Default }
ui:
  advanced: [hidden, size]
