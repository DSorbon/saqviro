# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.url.encode
name: URL Encode / Decode
category: developer
tool_version: 1
description: Percent-encode text for a URL, or read it back.
keywords: [percent, escape, query, uri]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: mode, type: enum, values: [encode, decode], default: encode }
  - { id: keep_url_characters, type: boolean, default: false }
presets:
  - { id: encode, name: Encode, params: { mode: encode } }
  - { id: decode, name: Decode, params: { mode: decode } }
ui:
  advanced: [keep_url_characters]
