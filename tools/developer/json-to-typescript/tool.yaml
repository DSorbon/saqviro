# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.json-to-ts
name: JSON to TypeScript
category: developer
tool_version: 1
description: Write TypeScript types that match a JSON sample.
keywords: [interface, types, typescript, generate]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: name, type: string, default: Root }
presets:
  - { id: default, name: Default }
