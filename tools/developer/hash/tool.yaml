# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.hash
name: Hash Generator
category: developer
tool_version: 1
description: Get the MD5, SHA and BLAKE3 hash of text.
keywords: [md5, sha1, sha256, sha512, blake3, digest, checksum]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: algorithm, type: enum, values: [all, md5, sha1, sha256, sha512, blake3], default: all }
presets:
  - { id: default, name: Default }
