# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.html-entities
name: HTML Entity Encode / Decode
category: developer
tool_version: 1
description: Escape text for HTML, or read entities back.
keywords: [escape, amp, nbsp, unescape]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: mode, type: enum, values: [encode, decode], default: encode }
presets:
  - { id: encode, name: Encode, params: { mode: encode } }
  - { id: decode, name: Decode, params: { mode: decode } }
