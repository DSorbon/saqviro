# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.json-to-csv
name: JSON to CSV
category: developer
tool_version: 1
description: Turn a JSON array into a CSV table.
keywords: [convert, table, spreadsheet, tsv]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: delimiter, type: enum, values: [comma, semicolon, tab], default: comma }
presets:
  - { id: default, name: Default }
