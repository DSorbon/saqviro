# yaml-language-server: $schema=../../../packages/tool-schema/tool.schema.json
schema_version: 1
id: developer.sql.format
name: SQL Formatter
category: developer
tool_version: 1
description: Indent SQL so it can be read.
keywords: [query, pretty, beautify, database]
inputs:
  - type: text
outputs:
  - type: text
engine: builtin
capabilities: { batch: false, preview: false, offline: true, destructive: false }
permissions: { network: false }
platforms: [windows, macos, linux]
parameters:
  - { id: uppercase, type: boolean, default: true }
  - { id: indent, type: enum, values: ["2", "4"], default: "2" }
presets:
  - { id: default, name: Default }
