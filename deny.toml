# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Copyleft that would bind the whole app (GPL, AGPL) is not allowed. See docs/decisions.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  # mozjpeg. Requires the notice "This software is based in part on the work of
  # the Independent JPEG Group" in the product documentation (third-party notices).
  "IJG",
  # LLVM's permissive license, via rav1e.
  "NCSA",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip 4 in tauri-plugin-updater: Windows only, reads an archive only after its signature is verified. Remove when the plugin moves to zip 9." },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 in tauri-plugin-updater: Windows only, reads an archive only after its signature is verified. Remove when the plugin moves to zip 9." },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 in tauri-plugin-updater: Windows only, reads an archive only after its signature is verified. Remove when the plugin moves to zip 9." },
  { id = "RUSTSEC-2026-0429", reason = "zip 4 in tauri-plugin-updater: Windows only, reads an archive only after its signature is verified. Remove when the plugin moves to zip 9." },
]
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" only fails for our direct dependencies;
# transitive ones (mostly from Tauri) are tracked upstream.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
