name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: e.g. Compress PDF
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Saqviro version and OS
      placeholder: 0.1.0, macOS 26.1
    validations:
      required: true
