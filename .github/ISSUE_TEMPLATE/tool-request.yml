name: Tool request
description: Suggest a new tool
labels: [tool request]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: Describe the task, not the solution. "Make a scanned PDF searchable" beats "add OCR".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
