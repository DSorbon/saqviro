name: Release

# Pushing a tag like v0.1.0 builds every platform into a draft release, which
# a person reviews and publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64, bundles: "app,dmg" }
          - { os: macos-13, name: macos-x64, bundles: "app,dmg" }
          - { os: ubuntu-24.04, name: linux-x64, bundles: "deb,appimage" }
          - { os: windows-latest, name: windows-x64, bundles: "nsis" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SAQVIRO_UPDATER_PUBKEY: ${{ vars.UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: ilammy/setup-nasm@v1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libheif-dev libheif-plugin-libde265 cmake
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf
      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            make diffutils pkgconf mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm
      - run: cargo install cargo-about --locked --features cli
      - run: pnpm install --frozen-lockfile
      - name: Prepare engines
        if: runner.os != 'Windows'
        run: scripts/prepare-bundle.sh
      - name: Prepare engines (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/prepare-bundle.sh
      - run: scripts/build-release.sh ${{ matrix.bundles }}
      - name: Check the app as another computer would
        if: runner.os == 'macOS'
        run: scripts/check-bundle.sh target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz*
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/nsis/*.exe*

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write the update manifest and checksums
        run: scripts/release-manifest.py "${GITHUB_REF_NAME#v}" artifacts artifacts/latest.json
      - name: Create a draft release
        run: |
          find artifacts -type f ! -name '*.sig' -exec sha256sum {} + | sed 's|artifacts/.*/||; s|artifacts/||' > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes SHA256SUMS \
            $(find artifacts -type f)
